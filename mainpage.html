<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="src/css/global/main.css">
    <link rel="stylesheet" href="src/css/global/navbar.css">
    <link rel="stylesheet" href="src/css/pages/usercontent.css">
    <link rel="stylesheet" href="src/css/components/createuser.css">
    <link rel="stylesheet" href="src/css/components/updateuser.css">
    <link rel="stylesheet" href="src/css/components/deleteuser.css">
</head>

<body>
    <div id="delete-modal" class="delete-overlay">
        <div class="delete-container">
            <p>Deseja excluir esse usuário?</p>
            <a id="btn-confirm" class="btn-confirm">Sim</a>
            <a id="btn-cancel" class="btn-cancel">Não</a>
        </div>
    </div>

    <div id="update-modal" class="update-overlay">
        <div class="update-modal">
            <p class="update-label">Alterar Dados</p>

            <div class="input-container">
                <input id="update-input-name" name="name" type="text" placeholder="Nome de usuário" />
                <input id="update-input-pwd" name="pwd" type="password" placeholder="Senha" />
                <input id="update-input-position" name="position" type="text" placeholder="Cargo Atual" />

                <select name="permission-options" id="update-input-permission">
                </select>
            </div>

            <div class="button-container">
                <div id="submit-update-button" class="submit-update-button">
                    <p>Alterar</p>
                </div>
                <div id="close-update-button" class="close-button">
                    <p>Fechar</p>
                </div>
            </div>
        </div>
    </div>

    <div id="create-modal" class="create-overlay">
        <div class="create-modal">
            <p class="create-label">Criar um Usuário</p>

            <div class="input-container">
                <input id="create-input-name" name="name" type="text" placeholder="Nome de usuário" />
                <input id="create-input-pwd" name="pwd" type="password" placeholder="Senha" />
                <input id="create-input-position" name="position" type="text" placeholder="Cargo Atual" />

                <select name="permission-options" id="create-input-permission">
                </select>
            </div>

            <div class="button-container">
                <div id="submit-create-button" class="submit-create-button">
                    <p>Criar</p>
                </div>
                <div id="close-create-button" class="close-button">
                    <p>Fechar</p>
                </div>
            </div>
        </div>
    </div>

    <div class="navbar">
        <p class="title">Tabela de Usuários</p>
        <div>
            <a class="login-button" href="index.html">Login</a>
            <a class="logout-button" href="backend/auth/logout.php">Logout</a>
        </div>
    </div>
    <div class="main-container">
        <div class="overlay">
        </div>
        <div class="user-container">
            <ul class="user-list">
                <li class="add-user">
                    <a id="button-add-user" class="add-user" style="width: 100%; height: 100%; color: gray;">+</a>
                </li>
            </ul>
        </div>
    </div>
</body>

<script type="module" src="src/js/main.js"></script>
<script type="module" src="src/js/components/createOptions.js"></script>

</html>
