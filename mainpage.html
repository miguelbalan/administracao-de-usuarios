<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="_css/main.css">
    <link rel="stylesheet" href="_css/navbar.css">
    <link rel="stylesheet" href="_css/usercontent.css">
    <link rel="stylesheet" href="_css/createuser.css">
    <link rel="stylesheet" href="_css/confirmscreen.css">
</head>

<body>
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-content">
            <p>Deseja excluir esse usuário?</p>
            <a id="btn-confirm" class="btn-confirm">Sim</a>
            <a id="btn-cancel" class="btn-cancel">Não</a>
        </div>
    </div>

    <div id="create-modal" class="create-overlay">
        <div class="create-modal">
            <p class="create-label">Criar um Usuário</p>

            <div class="input-container">
                <input id="input-name" name="name" type="text" placeholder="Nome de usuário" />
                <input id="input-pwd" name="pwd" type="password" placeholder="Senha" />
                <input id="input-position" name="position" type="text" placeholder="Cargo Atual" />

                <select name="permission-options" id="input-permission">
                </select>
            </div>

            <div id="create-button" class="create-button">
                <p>Criar</p>
            </div>
        </div>
    </div>

    <div class="navbar">
        <p class="title">Tabela de Usuários</p>
        <div>
            <a class="login-button" href="index.html">Login</a>
            <a class="logout-button" href="_php/logout.php">Logout</a>
        </div>
    </div>
    <div class="main-container">
        <div class="overlay">
        </div>
        <div class="user-container">
            <ul class="user-list">
                <li class="add-user">
                    <a id="button-add-user" class="add-user" style="width: 100%; height: 100%; color: gray;">+</a>
                </li>
            </ul>
        </div>
    </div>
</body>

<script type="module" src="_js/main.js"></script>
<script type="module" src="_js/createOptions.js"></script>

</html>
